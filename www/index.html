function dues(){
 var keys=Object.keys(S.days).sort(),first=keys[0],td=today(),base=first&&first<S.created?first:S.created;
 return S.people.map(function(p){
  var net=0,k=p.start||base,g=0,endk=p.until&&p.until<td?p.until:td;
  while(k&&k<=endk&&g++<1500){
   var d=S.days[k];
   net+=d?(d.leave&&d.leave[p.id]?0:d.rate):S.rate;
   k=shift(k,1);
  }
  keys.forEach(function(x){net-=S.days[x].paid[p.id]||0});
  var owe=Math.max(0,net);
  return {p:p,owe:owe,credit:Math.max(0,-net),n:Math.ceil(owe/S.rate)};
 });
}

  if(save()){closeModal();render();toast('Deleted')}
 }
 else if(a==='themeflip'){try{localStorage.setItem(THEME_KEY,isDark()?'light':'dark')}catch(err){toast('Could not save theme')}applyTheme();render()}
 else if(a==='theme'){try{localStorage.setItem(THEME_KEY,el.dataset.v)}catch(err){toast('Couldn\u2019t save theme')}applyTheme();render()}
 else if(a==='rate'){
  var inp=document.getElementById('rate'),n=parseInt(inp.value,10),re=document.getElementById('rerr');
  if(!(n>0)){re.textContent='Enter an amount above 0';return}
  S.rate=n;if(save()){re.textContent='';toast('Amount saved')}
 }
});
var holdT=0,holdFired=false,holdUp=0;
function holdCancel(){clearTimeout(holdT);holdT=0}
function holdLeave(id){
 var d=S.days[date],msg;
 if(d&&d.leave&&d.leave[id]){delete d.leave[id];msg='Cleared'}
 else{
  d=ensureDay(date);d.leave=d.leave||{};d.leave[id]='leave';
  var fr=d.paid[id]||0;if(fr>0){delete d.paid[id];carry(id,date,fr)}
  msg='Leave set for 1 day';
 }
 popId=id;
 if(save()){render();toast(msg)}
}
document.addEventListener('pointerdown',function(e){
 var el=e.target.closest('button.st[data-a="tog"]');if(!el)return;
 holdFired=false;holdCancel();
 holdT=setTimeout(function(){holdT=0;holdFired=true;holdLeave(el.dataset.id)},500);
});
document.addEventListener('pointerup',function(){holdCancel();if(holdFired){holdFired=false;holdUp=Date.now()}});
document.addEventListener('pointercancel',function(){holdCancel();holdFired=false});
document.addEventListener('contextmenu',function(e){if(e.target.closest('button.st[data-a="tog"]'))e.preventDefault()});
document.addEventListener('input',function(e){
 if(e.target.id==='am'&&amMode==='span'){amAuto=true;var n=ndays();rt=n>0?endFor(n):rf;rfresh()}
});
document.addEventListener('change',function(e){
 if(e.target.id==='dp'&&e.target.value){date=e.target.value;render(true)}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape')closeModal();
 if(e.key==='Enter'&&(e.target.id==='nm'||e.target.id==='am')){var b=document.querySelector('[data-a="savep"],[data-a="saveamt"]');if(b)b.click()}
});
window.addEventListener('hashchange',function(){closeModal();render(true)});
applyTheme();S=load();save();date=today();render(true);
try{var AP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(AP&&AP.addListener)AP.addListener('backButton',function(){if(document.getElementById('layer').innerHTML){closeModal()}else if(route()!=='day'){go('day')}else if(AP.exitApp){AP.exitApp()}})}catch(e){}
</script>
</body>
</html>
